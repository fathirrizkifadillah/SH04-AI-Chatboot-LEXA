server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for proxying to external domain
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    # Upstream backend Railway domain
    set $backend "https://sh04-ai-chatboot-lexa-production.up.railway.app";

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_set_header Host sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name sh04-ai-chatboot-lexa-production.up.railway.app;
    }

    # Proxy WebSocket connections
    location ^~ /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy Chat endpoints (SSE streaming, messages, reset)
    location /chat {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy Widget config
    location ^~ /config {
        proxy_pass $backend;
        proxy_set_header Host sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name sh04-ai-chatboot-lexa-production.up.railway.app;
    }

    # Proxy Widget static assets and loader
    location ^~ /widget/ {
        proxy_pass $backend;
        proxy_set_header Host sh04-ai-chatboot-lexa-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name sh04-ai-chatboot-lexa-production.up.railway.app;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
